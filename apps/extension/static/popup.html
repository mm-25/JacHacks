<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sherry</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <div class="logo" aria-hidden="true">S</div>
    <div>
      <div class="wordmark">Sherry</div>
      <div class="sub">Captures your AI chats into your memory</div>
    </div>
  </header>

  <section class="card" aria-labelledby="page-title">
    <h2 id="page-title" class="card-title">This page</h2>
    <p id="page-info" class="muted">Checking…</p>
    <button id="summarize" class="btn btn-primary" type="button" disabled>Summarize this chat now</button>
    <p id="summarize-result" class="small muted" role="status"></p>
  </section>

  <section class="card" aria-labelledby="status-title">
    <h2 id="status-title" class="card-title">Last activity</h2>
    <p id="status" class="small muted">Nothing captured yet.</p>
  </section>

  <section class="card" aria-labelledby="settings-title">
    <h2 id="settings-title" class="card-title">Connection</h2>
    <label class="label" for="api-url">Sherry URL</label>
    <input id="api-url" class="input" type="url" placeholder="http://localhost:8000" autocomplete="off">
    <label class="label" for="api-key">API key</label>
    <input id="api-key" class="input" type="password" placeholder="From Sherry → Connect an AI assistant" autocomplete="off">
    <div class="row">
      <button id="save" class="btn" type="button">Save &amp; test</button>
      <span id="save-result" class="small" role="status"></span>
    </div>
  </section>

  <section class="card" aria-labelledby="capture-title">
    <h2 id="capture-title" class="card-title">Capture</h2>
    <label class="toggle"><input id="site-chatgpt" type="checkbox"> ChatGPT (chatgpt.com)</label>
    <label class="toggle"><input id="site-claude" type="checkbox"> Claude (claude.ai)</label>
    <label class="toggle"><input id="site-gemini" type="checkbox"> Gemini (gemini.google.com)</label>
    <label class="toggle"><input id="paused" type="checkbox"> Pause all capture</label>
    <p class="small muted">Every message in open chats is sent to your Sherry. Deleting a chat's summary in Sherry erases its transcript and stops capturing that chat.</p>
  </section>

  <script src="popup.js"></script>
</body>
</html>
